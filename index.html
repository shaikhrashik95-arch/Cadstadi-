<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Eng. CAD Studio</title> <style> *{box-sizing:border-box} body{margin:0;background:#061629;color:white;font-family:Arial,sans-serif} header{padding:12px;background:#031020;display:flex;flex-wrap:wrap;gap:7px;align-items:center} h2{color:#36aaff;margin:0 auto 0 0;font-size:20px} button,input,select{padding:9px;border:1px solid #285779;border-radius:5px;background:#0b2b48;color:white} button{cursor:pointer} button:active,button.active{background:#087cff} .toolbar{display:flex;gap:5px;padding:8px;overflow-x:auto;background:#061b30} .toolbar button{white-space:nowrap} .layout{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px} .panel{background:#09233b;border:1px solid #245071;border-radius:7px;overflow:hidden;min-width:0} .panel h3{font-size:15px;padding:10px;margin:0;border-bottom:1px solid #245071} .pad{padding:9px} .canvasbox{height:400px;background:#f4f8fc} canvas{width:100%;height:100%;display:block;touch-action:none} .field{margin-bottom:8px} .field label{display:block;font-size:12px;color:#b8d5ec;margin-bottom:4px} .field input,.field select{width:100%} .two{display:grid;grid-template-columns:1fr 1fr;gap:7px} #message{font-size:13px;line-height:1.5;color:#a8d8ff} @media(max-width:700px){.layout{grid-template-columns:1fr}.canvasbox{height:360px}} </style> </head> <body> <header> <h2>⌂ Eng. CAD Studio</h2> <button onclick="saveProject()">Save</button> <button onclick="$('load').click()">Load</button> <input id="load" type="file" accept=".json" hidden onchange="loadProject(event)"> <button onclick="exportPNG()">PNG</button> <button onclick="window.print()">Print / PDF</button> <button onclick="exportDXF()">DXF</button> </header> <nav class="toolbar" id="toolbar"> <button data-tool="select" class="active">Select</button> <button data-tool="wall">Wall</button> <button data-tool="room">Room</button> <button data-tool="door">Door</button> <button data-tool="window">Window</button> <button data-tool="furniture">Furniture</button> <button data-tool="stairs">Stairs</button> <button data-tool="measure">Measure</button> <button onclick="cloneItem()">Clone</button> <button onclick="deleteItem()">Delete</button> <button onclick="undo()">Undo</button> <button onclick="redo()">Redo</button> <button onclick="addFloor()">+ Floor</button> </nav> <div class="layout"> <section class="panel"> <h3>2D Drawing — meters</h3> <div class="canvasbox"><canvas id="plan"></canvas></div> <div class="pad" id="message">প্রথমে Wall বেছে নিয়ে ড্রয়িং এলাকায় ট্যাপ করুন।</div> </section> <section class="panel"> <h3>3D House Preview</h3> <div class="canvasbox" style="background:#102a3b"><canvas id="three"></canvas></div> <div class="pad"> <button onclick="rotate3D(-1)">↶ Rotate</button> <button onclick="rotate3D(1)">Rotate ↷</button> <button onclick="zoom3D(1.15)">Zoom +</button> <button onclick="zoom3D(.87)">Zoom −</button> <p id="status">3D Preview তৈরি হচ্ছে...</p> </div> </section> <section class="panel"> <h3>Modern Design Library</h3> <div class="pad"> <button onclick="addLibrary('Bed')">Bed</button> <button onclick="addLibrary('Sofa')">Sofa</button> <button onclick="addLibrary('Table')">Table</button> <button onclick="addLibrary('Chair')">Chair</button> <button onclick="addLibrary('Cabinet')">Cabinet</button> <button onclick="addLibrary('Kitchen')">Kitchen</button> <button onclick="addLibrary('Toilet')">Toilet</button> <button onclick="addLibrary('Light')">Light</button> </div> </section> <section class="panel"> <h3>Item Settings</h3> <div class="pad"> <div class="field"><label>Item Type</label> <select id="type"> <option>Wall</option><option>Room</option><option>Door</option> <option>Window</option><option>Furniture</option><option>Stairs</option> </select></div> <div class="two"> <div class="field"><label>Length (m)</label><input id="length" type="number" step=".1" value="4"></div> <div class="field"><label>Width (m)</label><input id="width" type="number" step=".1" value=".15"></div> <div class="field"><label>Height (m)</label><input id="height" type="number" step=".1" value="3"></div> <div class="field"><label>Thickness (m)</label><input id="thickness" type="number" step=".01" value=".15"></div> <div class="field"><label>Position X</label><input id="x" type="number" step=".1" value="1"></div> <div class="field"><label>Position Y</label><input id="y" type="number" step=".1" value="1"></div> <div class="field"><label>Position Z</label><input id="z" type="number" step=".1" value="0"></div> <div class="field"><label>Rotation °</label><input id="rotation" type="number" value="0"></div> </div> <div class="field"><label>Color</label><input id="color" type="color" value="#34495e"></div> <div class="field"><label>Material</label> <select id="material"><option>Concrete</option><option>Wood</option><option>Glass</option><option>Marble</option><option>Tile</option><option>Metal</option></select></div> <div class="field"><label>Floor Pattern</label> <select id="pattern"><option>Plain</option><option>Tile Grid</option><option>Wood Plank</option><option>Marble</option></select></div> <div class="field"><label>Tile Size (m)</label><input id="tile" type="number" value=".6" step=".1"></div> <div class="field"><label>Layer</label> <select id="layer"><option>Architecture</option><option>Doors & Windows</option><option>Furniture</option><option>Electrical</option><option>Plumbing</option><option>Lighting</option></select></div> <div class="field"><label>Floor</label><select id="floor" onchange="changeFloor()"></select></div> <button onclick="applySettings()" style="width:100%">Apply Settings</button> <button onclick="clearFloor()" style="width:100%;margin-top:6px">Clear Floor</button> </div> </section> </div> <script> 'use strict'; const $=id=>document.getElementById(id); const plan=$('plan'),p=plan.getContext('2d'); const three=$('three'),v=three.getContext('2d'); let items=[],selected=null,tool='select'; let floors=['Ground Floor'],floorIndex=0; let history=[],future=[],drag=null; let scale=35,ox=25,oy=25,angle=0,zoom=1; function say(t){$('message').textContent=t} function record(){ history.push(JSON.stringify({items,floors,floorIndex})); if(history.length>40)history.shift(); future=[]; } function restore(s){ const d=JSON.parse(s); items=d.items||[];floors=d.floors||['Ground Floor']; floorIndex=d.floorIndex||0;selected=null;updateFloors();drawAll(); } function undo(){ if(!history.length)return; future.push(JSON.stringify({items,floors,floorIndex})); restore(history.pop()); } function redo(){ if(!future.length)return; history.push(JSON.stringify({items,floors,floorIndex})); restore(future.pop()); } function currentItems(){return items.filter(i=>i.floor===floorIndex)} function setTool(t){ tool=t; document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t)); say('Selected tool: '+t+' — এখন Drawing এলাকায় ট্যাপ করুন।'); } $('toolbar').addEventListener('click',e=>{ const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool); }); function newItem(type,x,y,name=type){ const colors={Wall:'#34495e',Room:'#d7c7a9',Door:'#98653b',Window:'#58bfea',Furniture:'#b49a79',Stairs:'#8b969f'}; return {id:Date.now()+Math.random(),type,name,x,y,length:type==='Wall'?4:type==='Door'?.9:type==='Window'?1.2:2,width:type==='Wall'?.15:type==='Door'?.12:type==='Window'?.12:1,height:type==='Wall'?3:1,thickness:.15,z:0,rotation:0,color:colors[type]||'#b49a79',material:'Concrete',pattern:'Plain',tile:.6,layer:type==='Furniture'?'Furniture':'Architecture',floor:floorIndex}; } function addLibrary(name){ record(); let o=newItem('Furniture',2,2,name);items.push(o);selected=o.id;fillSettings(o);drawAll(); } function addFloor(){ record();floors.push('Floor '+floors.length);floorIndex=floors.length-1;updateFloors();drawAll(); } function updateFloors(){ $('floor').innerHTML=floors.map((f,i)=>`<option value="${i}">${f}</option>`).join(''); $('floor').value=floorIndex; } function changeFloor(){floorIndex=Number($('floor').value);selected=null;drawAll()} function resizeCanvases(){ for(const c of [plan,three]){ const r=c.parentElement.getBoundingClientRect(); c.width=Math.max(1,Math.floor(r.width*devicePixelRatio)); c.height=Math.max(1,Math.floor(r.height*devicePixelRatio)); } drawAll(); } function drawPlan(){ const d=devicePixelRatio,w=plan.width,h=plan.height; p.clearRect(0,0,w,h);p.fillStyle='#f5f8fb';p.fillRect(0,0,w,h); const s=scale*d; p.strokeStyle='#dce5ed';p.lineWidth=1; for(let x=0;x<w;x+=s/2){p.beginPath();p.moveTo(x,0);p.lineTo(x,h);p.stroke()} for(let y=0;y<h;y+=s/2){p.beginPath();p.moveTo(0,y);p.lineTo(w,y);p.stroke()} p.save();p.scale(d,d);p.translate(ox,oy);p.scale(scale,scale); currentItems().forEach(o=>{ p.save();p.translate(o.x,o.y);p.rotate(o.rotation*Math.PI/180); p.fillStyle=o.color;p.strokeStyle=String(o.id)===String(selected)?'#087cff':'#263e50';p.lineWidth=.04; const width=Math.max(o.width,.2); if(o.type==='Room'){ p.globalAlpha=.3;p.fillRect(0,0,o.length,width);p.globalAlpha=1;p.strokeRect(0,0,o.length,width); if(o.pattern==='Tile Grid'){p.strokeStyle='#8c9aa5';for(let x=o.tile;x<o.length;x+=o.tile){p.beginPath();p.moveTo(x,0);p.lineTo(x,width);p.stroke()}for(let y=o.tile;y<width;y+=o.tile){p.beginPath();p.moveTo(0,y);p.lineTo(o.length,y);p.stroke()}} }else if(o.type==='Door'){ p.fillStyle='#fff';p.fillRect(0,0,o.length,width);p.strokeRect(0,0,o.length,width); p.beginPath();p.arc(0,0,o.length,0,Math.PI/2);p.strokeStyle=o.color;p.stroke(); }else if(o.type==='Window'){ p.fillStyle='#b8eaff';p.fillRect(0,0,o.length,width);p.strokeRect(0,0,o.length,width); p.beginPath();p.moveTo(0,width/2);p.lineTo(o.length,width/2);p.stroke(); }else{ p.fillRect(0,0,o.length,width);p.strokeRect(0,0,o.length,width); p.fillStyle='#fff';p.font='.22px Arial';p.fillText(o.name,.05,Math.min(width/2,.4)); } p.restore(); }); p.restore(); p.fillStyle='#17364d';p.font=`${13*d}px Arial`;p.fillText(floors[floorIndex]+' • '+currentItems().length+' items',10*d,20*d); } function draw3D(){ const w=three.width,h=three.height,d=devicePixelRatio; v.clearRect(0,0,w,h);v.fillStyle='#102b3b';v.fillRect(0,0,w,h); const list=currentItems(),unit=Math.min(w/12,h/10)*zoom,cx=w/2,cy=h*.65; v.strokeStyle='#28485a';v.lineWidth=1; for(let i=-10;i<=10;i++){v.beginPath();v.moveTo(cx+i*unit*.7,cy-10*unit);v.lineTo(cx+i*unit*.7,cy+10*unit);v.stroke()} list.forEach(o=>{ const a=o.x,b=o.y,l=o.length,wd=Math.max(o.width,.2),ht=Math.max(o.height,.3); function proj(x,y,z){const X=x*Math.cos(angle)-y*Math.sin(angle),Y=x*Math.sin(angle)+y*Math.cos(angle);return [cx+(X-Y)*unit*.55,cy+(X+Y)*unit*.27-z*unit*.65]} const pts=[[a,b,0],[a+l,b,0],[a+l,b+wd,0],[a,b+wd,0]]; const top=pts.map(q=>proj(q[0],q[1],o.type==='Room'?.03:ht)); const bot=pts.map(q=>proj(q[0],q[1],0)); function poly(ps,color){v.beginPath();ps.forEach((q,i)=>i?v.lineTo(q[0],q[1]):v.moveTo(q[0],q[1]));v.closePath();v.fillStyle=color;v.fill();v.strokeStyle=String(o.id)===String(selected)?'#00e5ff':'#d1e0e9';v.lineWidth=2*d;v.stroke()} const col=o.color; poly([bot[0],bot[1],top[1],top[0]],shade(col,.75)); poly([bot[1],bot[2],top[2],top[1]],shade(col,.55)); poly(top,o.type==='Room'?shade(col,1.15):shade(col,1.25)); }); if(!list.length){v.fillStyle='white';v.font=`${16*d}px Arial`;v.fillText('Add items in 2D',15*d,35*d)} $('status').textContent='Canvas 3D preview • '+list.length+' items'; } function shade(hex,f){ try{let c=hex.replace('#','');let r=parseInt(c.slice(0,2),16)*f,g=parseInt(c.slice(2,4),16)*f,b=parseInt(c.slice(4,6),16)*f;return '#'+[r,g,b].map(n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0')).join('')}catch(e){return hex} } function drawAll(){updateFloors();drawPlan();draw3D()} function fillSettings(o){ if(!o)return; ['type','length','width','height','thickness','x','y','z','rotation','color','material','pattern','tile','layer'].forEach(k=>{if($(k)&&o[k]!==undefined)$(k).value=o[k]}); } function applySettings(){ const o=items.find(i=>String(i.id)===String(selected)); if(!o){alert('প্রথমে 2D Drawing-এ একটি আইটেম নির্বাচন করুন।');return} record(); ['length','width','height','thickness','x','y','z','rotation','tile'].forEach(k=>o[k]=Number($(k).value)||0); ['type','color','material','pattern','layer'].forEach(k=>o[k]=$(k).value); drawAll();fillSettings(o);say('Settings applied. 2D ও preview আপডেট হয়েছে।'); } function nearest(x,y){ return currentItems().slice().reverse().find(o=>x>=o.x-.2&&y>=o.y-.2&&x<=o.x+o.length+.2&&y<=o.y+Math.max(o.width,.3)+.2); } function pos(e){const r=plan.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}} plan.addEventListener('pointerdown',e=>{ const q=pos(e),x=(q.x-ox)/scale,y=(q.y-oy)/scale; if(['wall','room','door','window','furniture','stairs'].includes(tool)){ record();const type={wall:'Wall',room:'Room',door:'Door',window:'Window',furniture:'Furniture',stairs:'Stairs'}[tool]; const o=newItem(type,x,y);items.push(o);selected=o.id;fillSettings(o);drawAll();return; } const o=nearest(x,y); if(o){ selected=o.id;fillSettings(o); if(tool==='select'){record();drag={id:o.id,x,y,ox:o.x,oy:o.y};plan.setPointerCapture(e.pointerId)} }else{ selected=null; if(tool==='measure')say('Position X: '+x.toFixed(2)+' m • Y: '+y.toFixed(2)+' m'); } drawAll(); }); plan.addEventListener('pointermove',e=>{ if(!drag)return; const q=pos(e),x=(q.x-ox)/scale,y=(q.y-oy)/scale; const o=items.find(i=>i.id===drag.id);if(!o)return; o.x=drag.ox+x-drag.x;o.y=drag.oy+y-drag.y;drawAll(); }); plan.addEventListener('pointerup',()=>{if(drag){drag=null;const o=items.find(i=>String(i.id)===String(selected));if(o)fillSettings(o)}}); plan.addEventListener('pointercancel',()=>drag=null); function cloneItem(){ const o=items.find(i=>String(i.id)===String(selected));if(!o)return alert('আগে আইটেম নির্বাচন করুন'); record();const n={...o,id:Date.now()+Math.random(),x:o.x+.5,y:o.y+.5};items.push(n);selected=n.id;fillSettings(n);drawAll(); } function deleteItem(){ if(selected===null)return alert('আগে আইটেম নির্বাচন করুন'); record();items=items.filter(i=>String(i.id)!==String(selected));selected=null;drawAll(); } function clearFloor(){ if(!confirm('এই Floor-এর সব আইটেম মুছবেন?'))return; record();items=items.filter(i=>i.floor!==floorIndex);selected=null;drawAll(); } function rotate3D(n){angle+=n*.15;draw3D()} function zoom3D(f){zoom=Math.max(.3,Math.min(3,zoom*f));draw3D()} function saveProject(){ const blob=new Blob([JSON.stringify({items,floors,floorIndex},null,2)],{type:'application/json'}); download(blob,'eng-cad-project.json'); } function loadProject(e){ const f=e.target.files[0];if(!f)return; const r=new FileReader(); r.onload=()=>{try{restore(r.result);say('Project loaded')}catch(err){alert('সঠিক JSON ফাইল নয়')}}; r.readAsText(f);e.target.value=''; } function exportPNG(){ const a=document.createElement('a');a.download='eng-cad-plan.png';a.href=plan.toDataURL('image/png');a.click(); } function exportDXF(){ let s='0\nSECTION\n2\nENTITIES\n'; currentItems().forEach(o=>{ const pts=[[o.x,o.y],[o.x+o.length,o.y],[o.x+o.length,o.y+o.width],[o.x,o.y+o.width],[o.x,o.y]]; for(let i=0;i<4;i++)s+=`0\nLINE\n8\n${o.layer}\n10\n${pts[i][0]}\n20\n${pts[i][1]}\n30\n0\n11\n${pts[i+1][0]}\n21\n${pts[i+1][1]}\n31\n0\n`; }); s+='0\nENDSEC\n0\nEOF\n';download(new Blob([s],{type:'application/dxf'}),'eng-cad-plan.dxf'); } function download(blob,name){ const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500); } window.addEventListener('resize',resizeCanvases); updateFloors();resizeCanvases(); </script> </body> </html>
