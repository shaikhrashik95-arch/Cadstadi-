<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Eng. CAD Studio</title> <style> *{box-sizing:border-box} body{margin:0;font-family:Arial;background:#101827;color:#fff} header{padding:12px;background:#0a1220;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap} h2{font-size:19px;margin:0} button,input,select{padding:9px;border-radius:6px;border:1px solid #43546b;background:#24344a;color:white} button{cursor:pointer} button.active{background:#0788c9} main{display:grid;grid-template-columns:230px 1fr;min-height:85vh} aside{background:#172438;padding:10px;overflow:auto} h3{font-size:13px;color:#65caff;margin-bottom:8px} .tools{display:grid;grid-template-columns:1fr 1fr;gap:5px} .field{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:7px 0} .field label{font-size:12px;color:#bdcde0} .field input,.field select{width:100%;margin-top:4px} .workspace{min-width:0} .tabs{display:flex;gap:6px;padding:8px;background:#0b1524;flex-wrap:wrap} .view{display:none;height:75vh;min-height:450px;position:relative} .view.active{display:block} canvas{display:block;width:100%;height:100%;touch-action:none} #plan{background:#f8fafc} #threeBox{position:absolute;inset:0;background:#e8edf4} #threeBox canvas{touch-action:auto} .hud{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:2} .status{padding:8px;background:#0b1524;color:#b9cce0;font-size:12px} @media(max-width:700px){ main{grid-template-columns:1fr} aside{max-height:45vh} .tools{grid-template-columns:repeat(3,1fr)} .view{height:60vh;min-height:350px} } </style> </head> <body> <header> <h2>Eng. CAD Studio</h2> <div> <button onclick="saveProject()">Save</button> <button onclick="exportProject()">Export JSON</button> <button onclick="document.getElementById('fileInput').click()">Import</button> <input id="fileInput" type="file" accept=".json" hidden onchange="importProject(event)"> </div> </header> <main> <aside> <h3>DRAWING TOOLS</h3> <div class="tools"> <button class="active" onclick="setTool('select',this)">Select / Move</button> <button onclick="setTool('wall',this)">Wall</button> <button onclick="setTool('room',this)">Room</button> <button onclick="setTool('door',this)">Door</button> <button onclick="setTool('window',this)">Window</button> <button onclick="setTool('furniture',this)">Furniture</button> <button onclick="setTool('stairs',this)">Stairs</button> <button onclick="setTool('electrical',this)">Electrical</button> <button onclick="setTool('plumbing',this)">Plumbing</button> <button onclick="setTool('dimension',this)">Dimension</button> </div> <h3>ITEM SETTINGS</h3> <div class="field"> <label>Name<input id="name" value="Wall"></label> <label>Color<input id="color" type="color" value="#8796a8"></label> </div> <div class="field"> <label>Length (m)<input id="length" type="number" value="4" min=".1" step=".1"></label> <label>Width (m)<input id="width" type="number" value=".2" min=".1" step=".1"></label> </div> <div class="field"> <label>Height (m)<input id="height" type="number" value="3" min=".1" step=".1"></label> <label>Grid (m)<select id="grid"><option value=".25">0.25</option><option value=".5" selected>0.5</option><option value="1">1</option></select></label> </div> <button style="width:100%" onclick="applySettings()">Apply to selected</button> <button style="width:100%;margin-top:5px" onclick="deleteSelected()">Delete selected</button> <h3>2D ZOOM</h3> <div class="tools"> <button onclick="zoom2D(1.2)">Zoom +</button> <button onclick="zoom2D(.83)">Zoom −</button> <button onclick="reset2D()">Reset</button> <button onclick="fitDrawing()">Fit drawing</button> </div> <p style="font-size:12px;color:#b9cce0">Select a tool and drag on the plan. Select/Move lets you move items. Mouse wheel or pinch to zoom.</p> <h3>PROJECT</h3> <div class="tools"> <button onclick="undo()">Undo</button> <button onclick="redo()">Redo</button> <button onclick="sampleHouse()">Sample House</button> <button onclick="clearAll()">Clear all</button> </div> </aside> <section class="workspace"> <div class="tabs"> <button id="tab2" class="active" onclick="showView('2d')">2D Plan</button> <button id="tab3" onclick="showView('3d')">3D House</button> <button onclick="reset3D()">Reset 3D Camera</button> </div> <div id="view2d" class="view active"> <canvas id="plan"></canvas> <div class="hud"><button onclick="toggleGrid()">Grid On/Off</button></div> </div> <div id="view3d" class="view"> <div id="threeBox"></div> <div class="hud"> <button onclick="toggleWalls()">Walls On/Off</button> <button onclick="toggleRoof()">Roof On/Off</button> </div> </div> <div class="status" id="status">Ready</div> </section> </main> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> <script> const $=id=>document.getElementById(id); const canvas=$('plan'),ctx=canvas.getContext('2d'); let items=[],selected=null,tool='select',scale=40,ox=30,oy=30; let drag=null,gridOn=true,wallsOn=true,roofOn=false; let history=[],future=[],nextId=1; let scene,camera,renderer,controls,houseGroup,wallGroup,roofGroup; let threeReady=false; function status(t){$('status').textContent=t} function gridStep(){return +$('grid').value||.5} function snap(v){let g=gridStep();return Math.round(v/g)*g} function point(e){ let r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale} } function screen(x,y){return{x:ox+x*scale,y:oy+y*scale}} function resize2D(){ let r=canvas.getBoundingClientRect(),d= Math.min(devicePixelRatio||1,2); canvas.width=Math.max(1,Math.round(r.width*d)); canvas.height=Math.max(1,Math.round(r.height*d)); ctx.setTransform(d,0,0,d,0,0);draw2D(); } function draw2D(){ let w=canvas.clientWidth,h=canvas.clientHeight; ctx.clearRect(0,0,w,h);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,w,h); if(gridOn){ let step=Math.max(5,scale*gridStep()); ctx.strokeStyle='#e1e7ef';ctx.lineWidth=1;ctx.beginPath(); for(let x=((ox%step)+step)%step;x<w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,h)} for(let y=((oy%step)+step)%step;y<h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y)} ctx.stroke(); } items.forEach(drawItem); } function drawItem(it){ let a=screen(it.x,it.y),len=it.length*scale,wd=Math.max(5,it.width*scale); ctx.save();ctx.translate(a.x,a.y);ctx.rotate(it.rotation||0); ctx.lineWidth=it.id===selected?3:1.5; ctx.strokeStyle=it.id===selected?'#008bd2':'#43546b'; if(it.type==='wall'){ ctx.fillStyle=it.color;ctx.fillRect(0,-wd/2,len,wd);ctx.strokeRect(0,-wd/2,len,wd); }else if(it.type==='room'){ ctx.fillStyle=it.color+'44';ctx.fillRect(0,0,len,wd);ctx.strokeRect(0,0,len,wd); ctx.fillStyle='#1e293b';ctx.font='13px Arial';ctx.fillText(it.name,5,18); }else if(it.type==='door'){ ctx.strokeStyle='#8b5e34';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke(); ctx.beginPath();ctx.arc(0,0,len,0,Math.PI/2);ctx.stroke(); }else if(it.type==='window'){ ctx.fillStyle='#b8e6f8';ctx.fillRect(0,-wd/2,len,wd);ctx.strokeRect(0,-wd/2,len,wd); }else if(it.type==='stairs'){ ctx.fillStyle='#cbd5e1';ctx.fillRect(0,0,len,wd);ctx.strokeRect(0,0,len,wd); for(let x=0;x<len;x+=Math.max(8,len/8)){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,wd);ctx.stroke()} }else if(it.type==='electrical'||it.type==='plumbing'){ ctx.fillStyle=it.type==='electrical'?'#eab308':'#0891b2'; ctx.beginPath();ctx.arc(len/2,wd/2,Math.max(5,wd/2),0,Math.PI*2);ctx.fill(); }else if(it.type==='dimension'){ ctx.strokeStyle='#dc2626';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke(); ctx.fillStyle='#dc2626';ctx.font='12px Arial';ctx.fillText(it.length+' m',len/2,-7); }else{ ctx.fillStyle=it.color;ctx.fillRect(0,0,len,wd);ctx.strokeRect(0,0,len,wd); ctx.fillStyle='#172033';ctx.font='11px Arial';ctx.fillText(it.name,4,14); } if(it.id===selected){ctx.setLineDash([4,3]);ctx.strokeStyle='#008bd2';ctx.strokeRect(-4,-wd/2-4,len+8,wd+8)} ctx.restore(); } function saveHistory(){history.push(JSON.stringify(items));if(history.length>50)history.shift();future=[]} function setTool(t,b){ tool=t;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active'); $('name').value=t[0].toUpperCase()+t.slice(1);status('Tool: '+t); } function makeItem(type,x,y,len,width){ return {id:nextId++,type,name:$('name').value||type,x:snap(x),y:snap(y), length:Math.max(.1,len||+$('length').value||4), width:Math.max(.1,width||+$('width').value||.2), height:Math.max(.1,+$('height').value||3),color:$('color').value, rotation:0}; } function add(type,x,y,len,width){ saveHistory();let it=makeItem(type,x,y,len,width);items.push(it);selected=it.id; drawAll(); } function hitTest(p){ for(let i=items.length-1;i>=0;i--){ let it=items[i]; if(p.x>=it.x-.2&&p.x<=it.x+it.length+.2&& p.y>=it.y-Math.max(it.width,.3)&&p.y<=it.y+Math.max(it.width,.3))return it; } return null; } canvas.addEventListener('pointerdown',e=>{ e.preventDefault();canvas.setPointerCapture?.(e.pointerId); let p=point(e); if(tool==='select'){ let it=hitTest(p);selected=it?it.id:null; if(it){$('name').value=it.name;$('length').value=it.length;$('width').value=it.width;$('height').value=it.height;$('color').value=it.color;drag={id:it.id,dx:p.x-it.x,dy:p.y-it.y,changed:false}} else drag=null; draw2D();return; } drag={drawing:true,x:snap(p.x),y:snap(p.y)}; }); canvas.addEventListener('pointermove',e=>{ if(!drag)return;let p=point(e); if(drag.id){ let it=items.find(i=>i.id===drag.id);if(!it)return; if(!drag.changed){saveHistory();drag.changed=true} it.x=snap(p.x-drag.dx);it.y=snap(p.y-drag.dy);drawAll(); }else if(drag.drawing){ draw2D();let a=screen(drag.x,drag.y),b=screen(snap(p.x),snap(p.y)); ctx.strokeStyle='#008bd2';ctx.setLineDash([5,4]);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.setLineDash([]); } }); canvas.addEventListener('pointerup',e=>{ if(!drag)return; if(drag.drawing){ let p=point(e),x=drag.x,y=drag.y; let dx=Math.abs(snap(p.x)-x),dy=Math.abs(snap(p.y)-y); if(tool==='room'){ saveHistory();let it=makeItem('room',Math.min(x,snap(p.x)),Math.min(y,snap(p.y)),Math.max(.5,dx),Math.max(.5,dy));it.width=Math.max(.5,dy);items.push(it);selected=it.id; }else if(tool==='wall'){ let len=Math.hypot(p.x-x,p.y-y); add('wall',x,y,Math.max(.5,len),+$('width').value||.2); items[items.length-1].rotation=Math.atan2(p.y-y,p.x-x); }else{ let len=Math.max(.5,dx); add(tool,x,y,len,tool==='door'?.9:tool==='window'?1.2:Math.max(.3,dy)); } } drag=null;drawAll(); }); canvas.addEventListener('pointercancel',()=>{drag=null;draw2D()}); canvas.addEventListener('wheel',e=>{e.preventDefault();zoom2D(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false}); function zoom2D(f,cx,cy){ let r=canvas.getBoundingClientRect(),px=cx==null?canvas.clientWidth/2:cx-r.left,py=cy==null?canvas.clientHeight/2:cy-r.top; let wx=(px-ox)/scale,wy=(py-oy)/scale; scale=Math.max(8,Math.min(200,scale*f));ox=px-wx*scale;oy=py-wy*scale;draw2D(); } function reset2D(){scale=40;ox=30;oy=30;draw2D()} function fitDrawing(){ if(!items.length){reset2D();return} let minX=Math.min(...items.map(i=>i.x)),minY=Math.min(...items.map(i=>i.y)); let maxX=Math.max(...items.map(i=>i.x+i.length)),maxY=Math.max(...items.map(i=>i.y+i.width)); scale=Math.max(8,Math.min(100,(canvas.clientWidth-70)/Math.max(1,maxX-minX),(canvas.clientHeight-70)/Math.max(1,maxY-minY))); ox=35-minX*scale;oy=35-minY*scale;draw2D(); } function drawAll(){draw2D();if(threeReady)rebuild3D()} function applySettings(){ let it=items.find(i=>i.id===selected); if(!it){status('Select an item first');return} saveHistory();it.name=$('name').value;it.length=Math.max(.1,+$('length').value||it.length); it.width=Math.max(.1,+$('width').value||it.width);it.height=Math.max(.1,+$('height').value||it.height);it.color=$('color').value; drawAll();status('Item settings updated'); } function deleteSelected(){ if(!selected)return;saveHistory();items=items.filter(i=>i.id!==selected);selected=null;drawAll();status('Deleted'); } function undo(){if(!history.length)return;future.push(JSON.stringify(items));items=JSON.parse(history.pop());selected=null;drawAll()} function redo(){if(!future.length)return;history.push(JSON.stringify(items));items=JSON.parse(future.pop());selected=null;drawAll()} function clearAll(){if(!confirm('Delete all drawing?'))return;saveHistory();items=[];selected=null;drawAll()} function toggleGrid(){gridOn=!gridOn;draw2D()} function showView(v){ $('view2d').classList.toggle('active',v==='2d');$('view3d').classList.toggle('active',v==='3d'); $('tab2').classList.toggle('active',v==='2d');$('tab3').classList.toggle('active',v==='3d'); if(v==='3d'&&!threeReady)init3D();setTimeout(()=>{resize2D();resize3D()},100); } function saveProject(){ try{localStorage.setItem('engCadStudio',JSON.stringify({items,scale,ox,oy}));status('Saved in this browser')} catch(e){status('Browser storage unavailable')} } function exportProject(){ let blob=new Blob([JSON.stringify({app:'Eng. CAD Studio',items},null,2)],{type:'application/json'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eng-cad-project.json';a.click();URL.revokeObjectURL(a.href); } function importProject(e){ let f=e.target.files[0];if(!f)return; let r=new FileReader();r.onload=()=>{ try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error('Invalid file'); saveHistory();items=d.items;nextId=Math.max(1,...items.map(i=>i.id+1));selected=null;drawAll();fitDrawing();status('Project imported'); }catch(err){alert('Could not import JSON: '+err.message)} };r.readAsText(f);e.target.value=''; } function sampleHouse(){ saveHistory();items=[]; items.push(makeItem('room',1,1,8,6)); let r=items[0];r.name='Living Room';r.width=6;r.color='#d8e2ec'; let w=makeItem('wall',1,1,8,.2);w.name='Front wall';items.push(w); w=makeItem('wall',1,7,8,.2);w.name='Back wall';items.push(w); w=makeItem('wall',1,1,6,.2);w.rotation=Math.PI/2;w.name='Left wall';items.push(w); w=makeItem('wall',9,1,6,.2);w.rotation=Math.PI/2;w.name='Right wall';items.push(w); items.push(makeItem('door',2,1,.9,.15)); items.push(makeItem('window',5,1,1.4,.15)); let f=makeItem('furniture',3,3,2,1);f.name='Sofa';f.color='#6c8ebf';items.push(f); f=makeItem('furniture',6,4,1.4,.8);f.name='Table';f.color='#b59b7b';items.push(f); items.push(makeItem('stairs',7,2,1.5,1)); selected=null;drawAll();fitDrawing();if(!threeReady)init3D();status('Sample house created'); } /* THREE.JS REAL 3D VIEW */ function init3D(){ if(!window.THREE||!THREE.OrbitControls){status('3D library failed to load. Check internet and reload.');return} try{ scene=new THREE.Scene();scene.background=new THREE.Color(0xe8edf4); camera=new THREE.PerspectiveCamera(45,1,.1,500);camera.position.set(12,12,15); renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputEncoding=THREE.sRGBEncoding; $('threeBox').innerHTML='';$('threeBox').appendChild(renderer.domElement); controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(4,1,4); scene.add(new THREE.HemisphereLight(0xffffff,0x748196,2)); let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,10);sun.castShadow=true;scene.add(sun); let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xe1e7ef,roughness:1})); ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground); let grid=new THREE.GridHelper(100,100,0x9aa8b8,0xcbd5e1);grid.position.y=-.06;scene.add(grid); houseGroup=new THREE.Group();scene.add(houseGroup);wallGroup=new THREE.Group();roofGroup=new THREE.Group();houseGroup.add(wallGroup,roofGroup); threeReady=true;resize3D();rebuild3D();animate();status('3D House ready'); }catch(e){console.error(e);status('3D error: '+e.message)} } function material(color){return new THREE.MeshStandardMaterial({color:color||'#8796a8',roughness:.8})} function boxMesh(group,w,h,d,x,y,z,color){ let m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.05,w),Math.max(.05,h),Math.max(.05,d)),material(color)); m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m; } function clearGroup(g){ while(g.children.length){let o=g.children[0];g.remove(o);o.geometry?.dispose();if(o.material)o.material.dispose()} } function rebuild3D(){ if(!threeReady)return;clearGroup(wallGroup);clearGroup(roofGroup); let maxX=8,maxZ=8; items.forEach(it=>{maxX=Math.max(maxX,it.x+it.length+1);maxZ=Math.max(maxZ,it.y+it.width+1)}); for(let it of items){ let x=it.x,z=it.y,len=it.length,w=Math.max(.15,it.width),h=it.height||3; if(it.type==='wall'){ let m=boxMesh(wallGroup,len,h,w,x+len/2,h/2,z,it.color);m.rotation.y=-(it.rotation||0); }else if(it.type==='room'){ let slab=boxMesh(wallGroup,len,.08,w,x+len/2,.02,z+w/2,it.color); slab.material.transparent=true;slab.material.opacity=.6; let t=.15,rh=3; boxMesh(wallGroup,len,rh,t,x+len/2,rh/2,z,it.color); boxMesh(wallGroup,len,rh,t,x+len/2,rh/2,z+w,it.color); boxMesh(wallGroup,t,rh,w,x,rh/2,z+w/2,it.color); boxMesh(wallGroup,t,rh,w,x+len,rh/2,z+w/2,it.color); }else if(it.type==='door'){ boxMesh(wallGroup,len,2.1,.12,x+len/2,1.05,z,'#986b43'); }else if(it.type==='window'){ boxMesh(wallGroup,len,1.1,.12,x+len/2,1.5,z,'#71c8e8'); }else if(it.type==='furniture'){ let fh=Math.min(h,1.1);boxMesh(wallGroup,len,fh,w,x+len/2,fh/2,z+w/2,it.color); }else if(it.type==='stairs'){ for(let k=0;k<8;k++){let sh=(k+1)*.22;boxMesh(wallGroup,len/8,sh,w,x+len*(k+.5)/8,sh/2,z+w/2,it.color)} }else if(it.type==='electrical'){ let m=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.08,16),material('#eab308'));m.position.set(x+len/2,.2,z+w/2);wallGroup.add(m); }else if(it.type==='plumbing'){ let m=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.25,16),material('#0891b2'));m.position.set(x+len/2,.15,z+w/2);wallGroup.add(m); }else if(it.type==='dimension'){ boxMesh(wallGroup,len,.03,.03,x+len/2,.05,z,'#dc2626'); } } if(roofOn)boxMesh(roofGroup,maxX,.2,maxZ,maxX/2,3.1,maxZ/2,'#52657b'); wallGroup.visible=wallsOn;roofGroup.visible=roofOn; controls.target.set(maxX/2,1,maxZ/2);resize3D(); } function resize3D(){ if(!threeReady||!renderer)return; let w=Math.max(1,$('threeBox').clientWidth),h=Math.max(1,$('threeBox').clientHeight); renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix(); } function animate(){if(!threeReady)return;requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)} function reset3D(){if(!threeReady)return;camera.position.set(12,12,15);controls.target.set(4,1,4);controls.update()} function toggleWalls(){wallsOn=!wallsOn;if(wallGroup)wallGroup.visible=wallsOn} function toggleRoof(){roofOn=!roofOn;if(threeReady)rebuild3D()} window.addEventListener('resize',()=>{resize2D();resize3D()}); try{ let saved=JSON.parse(localStorage.getItem('engCadStudio')||'null'); if(saved&&Array.isArray(saved.items)){items=saved.items;nextId=Math.max(1,...items.map(i=>i.id+1));scale=saved.scale||40;ox=saved.ox||30;oy=saved.oy||30} }catch(e){} resize2D(); setTimeout(()=>{if(window.THREE&&THREE.OrbitControls)init3D();else status('2D ready. 3D needs internet to load Three.js.')},250); </script> </body> </html>
